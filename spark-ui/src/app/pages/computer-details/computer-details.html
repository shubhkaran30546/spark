<!-- src/app/pages/computer-details/computer-details.html -->
<div class="computer-details" *ngIf="computer; else loading">
  <button class="back-button" (click)="goBack()">← Back to List</button>
  
  <div class="computer-container">
    <div class="computer-image">
      <img [src]="computer.imageUrl || 'assets/placeholder-computer.jpg'" [alt]="computer.name">
    </div>
    
    <div class="computer-info">
      <h1>{{ computer.name }}</h1>
      <p class="price">{{ computer.price | currency }}</p>
      <p class="description">{{ computer.description || 'No description available.' }}</p>
      
      <div *ngIf="computer.components && computer.components.length > 0" class="components-section">
        <h3>Available Components</h3>
        <p>Select additional components (optional):</p>
        
        <div class="components-grid">
          <div *ngFor="let component of computer.components" 
               class="component-card" 
               [class.selected]="isComponentSelected(component)"
               (click)="toggleComponent(component)">
            <h4>{{ component.name }}</h4>
            <p class="type">{{ component.type }}</p>
            <p class="price">{{ component.price | currency }}</p>
          </div>
        </div>
      </div>
      
      <button class="add-to-cart" (click)="addToCart(computer)">Add to Cart</button>
    </div>
  </div>
</div>

<ng-template #loading>
  <div class="loading" *ngIf="!error">
    <div class="spinner"></div>
    <p>Loading computer details...</p>
  </div>
  
  <div *ngIf="error" class="error-message">
    {{ error }}
    <button (click)="goBack()">Go Back</button>
  </div>
</ng-template>
