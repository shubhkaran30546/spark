<section class="hero">
  <h1>Build Your Perfect Machine</h1>
  <p>High-performance customizable computers</p>
  <button routerLink="/shop">Browse Computers</button>
</section>

<section class="featured">
  <h2>Featured Computers</h2>

  <div class="grid">
    <div class="card" *ngFor="let pc of featuredComputers">
      <img [src]="pc.image" />
      <h3>{{ pc.name }}</h3>
      <p>Starting at ${{ pc.price }}</p>
      <button routerLink="['/computer', pc.id]">Customize</button>
    </div>
  </div>
</section>
