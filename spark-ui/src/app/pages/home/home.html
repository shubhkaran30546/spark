<div class="hero">
  <h1>Build Your Perfect Computer</h1>
  <p>High-performance PCs, customized for you</p>
  <button class="primary-btn" (click)="navigateToComputer()">Browse Computers</button>
</div>

<section class="products">
  <div class="card" *ngFor="let computer of computers">
    <img [src]="computer.imageUrl" [alt]="computer.name" />
    <h3>{{ computer.name }}</h3>
    <p class="price">From ${{ computer.price }}</p>
    <button class="secondary-btn">Customize</button>
  </div>
</section>

<section class="why">
  <h2>Why Spark?</h2>
  <ul>
    <li>✔ Custom components</li>
    <li>✔ Transparent pricing</li>
    <li>✔ Clean & simple</li>
  </ul>
</section>
